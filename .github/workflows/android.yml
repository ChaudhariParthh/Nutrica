name: Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradle Wrapper
      # In typical Android environments, gradlew is used. Since the local system may use a direct gradle command,
      # we make sure the wrapper (if present) has execution rights.
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        fi

    - name: Run Build and Unit Tests
      # If gradlew is present we use it, otherwise fallback to global gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug testDebugUnitTest --stacktrace
        else
          gradle assembleDebug testDebugUnitTest --stacktrace
        fi
